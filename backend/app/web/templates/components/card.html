<div class="bg-white rounded-2xl overflow-hidden border border-brand-border
            shadow-[0_4px_16px_rgba(0,0,0,0.05)]
            hover:shadow-[0_8px_24px_rgba(0,0,0,0.1)]
            hover:-translate-y-1 transition-all duration-300">

  <!-- صورة العنصر -->
  <div class="aspect-[4/3] bg-brand-border overflow-hidden">
    {% if item.image_url %}
      <img src="{{ item.image_url }}" alt="{{ item.name }}"
           class="w-full h-full object-cover" loading="lazy">
    {% else %}
      <div class="w-full h-full flex items-center justify-center text-brand-grey">
        <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
    {% endif %}
  </div>

  <!-- المحتوى -->
  <div class="p-4">
    <h3 class="text-lg font-extrabold text-brand-black mb-1">{{ item.name }}</h3>
    <p class="text-sm text-brand-grey leading-relaxed line-clamp-2 mb-3"
       style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
      {{ item.description or '' }}
    </p>

    <div class="flex items-center justify-between">
      <span class="text-brand-red font-black text-lg">
        {{ '{:,}'.format(item.price) }} <span class="text-sm font-bold">ل.س</span>
      </span>
      {% if item.is_featured %}
        <span class="text-brand-yellow text-xl">★</span>
      {% endif %}
    </div>
  </div>
</div>
